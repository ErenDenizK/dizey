
<div class="st-view st-map" id="map-view" lang="tr">
  <div class="st-map__top" id="map-top">
    <span class="st-map__brand" id="brand">Dizey</span>
    <span class="st-map__exam" id="exam-countdown">Vize 1 · 20 Kas</span>
  </div>
  <div id="map-head">
    <h1 class="st-map__title">Lineer Cebir</h1>
    <p class="st-map__meta" id="unit-meta" aria-live="polite">Ünite A · 11 ders</p>
  </div>
  <div class="st-tabs" role="tablist" aria-label="Üniteler" id="unit-tabs" data-group="choice"></div>
  <div class="st-tiles" id="tiles" role="tabpanel" data-group="grid"></div>
  <div class="st-map__dock" id="map-dock">
    <button type="button" class="st-btn st-btn--primary" id="map-continue" data-primary>A3 · Matris çarpımına başla</button>
  </div>
  <div class="st-map__ghost" id="map-ghost" aria-hidden="true"></div>
</div>

<div class="st-view st-lesson" id="lesson-view" lang="tr" hidden>
  <header class="st-top" id="top">
    <button type="button" class="st-icon-btn" id="lesson-close" data-layer="A" aria-label="Ders haritasına dön">
      <svg class="st-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button type="button" class="st-icon-btn st-back is-off" id="lesson-back" data-layer="A" aria-label="Önceki adım" disabled>
      <svg class="st-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </button>
    <div class="st-progress" id="progress" aria-hidden="true"></div>
    <span class="st-count"><span id="count-lesson"></span><span id="count">1/10</span></span>
  </header>
  <main class="st-stage" id="stage">
    <div class="st-scene" id="scene"></div>
    <div class="st-work" id="work" aria-live="polite"></div>
    <div class="st-fx" id="fx"></div>
    <button type="button" class="st-icon-btn st-replay" id="replay" data-group="controls" aria-label="Hareketi tekrar oynat" hidden>
      <svg class="st-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5M5 4v4h4"/></svg>
    </button>
  </main>
  <section class="st-narr" id="narr" aria-live="polite">
    <div class="st-narr__row" id="narr-row">
      <p class="st-eyebrow" id="eyebrow"></p>
      <button type="button" class="st-unclear" id="unclear" data-group="controls" aria-pressed="false">Anlamadım</button>
    </div>
    <h2 class="st-title" id="title"></h2>
    <p class="st-body" id="body"></p>
  </section>
  <footer class="st-dock" id="dock"></footer>
</div>

<div class="st-overlay" id="overlay" aria-hidden="true"></div>
