<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171511" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dizey" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180x180.png" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <title>Dizey</title>
    <script>
      // GitHub Pages serves 404.html for deep links; it redirects here with the path in ?p=.
      ;(() => {
        const params = new URLSearchParams(location.search)
        const path = params.get('p')
        if (path === null) return
        params.delete('p')
        const rest = params.toString()
        history.replaceState(null, '', location.pathname + path.replace(/^\//, '') + (rest ? `?${rest}` : '') + location.hash)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
