    <script>
      // GitHub Pages serves 404.html for deep links; it redirects here with the path in ?p=.
      ;(() => {
        const params = new URLSearchParams(location.search)
        const path = params.get('p')
        if (path === null) return
        params.delete('p')
        const rest = params.toString()
        history.replaceState(null, '', location.pathname + path.replace(/^\//, '') + (rest ? `?${rest}` : '') + location.hash)
      })()
    </script>
