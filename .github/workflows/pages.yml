name: Pages

# One deployment holds production (site root) and every open PR (pr-preview/pr-<n>/).
# It always runs in the default branch's context, so the github-pages environment's
# default-branch protection stays on. Only same-repository PRs are built.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    # Job-level, so a skipped run (CI on a push to main) never cancels a real build.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      previews: ${{ steps.previews.outputs.list }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build production
        run: |
          pnpm install --frozen-lockfile
          DIZEY_CHANNEL=production DIZEY_BASE=/${{ github.event.repository.name }}/ GITHUB_SHA=$(git rev-parse HEAD) pnpm build
          mkdir -p _site && cp -r dist/. _site/
      # Only the PR whose CI just passed is rebuilt. Every other open preview is copied from the
      # live site when its recorded commit still matches, and rebuilt only when it does not.
      # (Actions minutes are limited: rebuilding every preview on every run cost minutes per PR.)
      - name: Build or reuse open PR previews
        id: previews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          TRIGGER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          live="https://${OWNER,,}.github.io/$NAME/pr-preview"
          reuse() { # number sha dir: copies a live preview built from this exact commit
            local number=$1 sha=$2 dir=$3 file
            [ "$(curl -fsS "$live/pr-$number/_preview-sha.txt" 2>/dev/null)" = "$sha" ] || return 1
            curl -fsS "$live/pr-$number/_preview-files.txt" -o /tmp/files.txt || return 1
            while read -r file; do
              [ -n "$file" ] || continue
              mkdir -p "$dir/$(dirname "$file")"
              curl -fsS "$live/pr-$number/$file" -o "$dir/$file" || return 1
            done < /tmp/files.txt
            cp /tmp/files.txt "$dir/_preview-files.txt"
            echo "$sha" > "$dir/_preview-sha.txt"
          }
          list=""
          for row in $(gh pr list --repo "$REPO" --state open --json number,headRefOid,isCrossRepository \
              --jq '.[] | select(.isCrossRepository | not) | "\(.number):\(.headRefOid)"'); do
            number=${row%%:*}; sha=${row#*:}
            dir="_site/pr-preview/pr-$number"
            if [ "$number" != "$TRIGGER" ] && reuse "$number" "$sha" "$dir"; then
              echo "Reused the live preview of PR #$number"
              list="$list $number"
              continue
            fi
            rm -rf "$dir"
            git fetch --no-tags origin "pull/$number/head"
            rm -rf "../pr-$number" && git worktree add --detach "../pr-$number" "$sha"
            if (cd "../pr-$number" && test -f package.json && pnpm install --frozen-lockfile \
                && DIZEY_CHANNEL="pr-$number" DIZEY_BASE="/$NAME/pr-preview/pr-$number/" GITHUB_SHA="$sha" pnpm build); then
              mkdir -p "$dir" && cp -r "../pr-$number/dist/." "$dir/"
              (cd "$dir" && find . -type f | sed 's|^\./||' | grep -v '^_preview-' | sort > /tmp/list.txt && mv /tmp/list.txt _preview-files.txt && echo "$sha" > _preview-sha.txt)
              list="$list $number"
            else
              echo "::warning::Preview build failed for PR #$number"
            fi
          done
          echo "list=${list# }" >> "$GITHUB_OUTPUT"
      - run: node scripts/write-404.mjs _site /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # Deployments queue instead of being cut off halfway.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  comment:
    needs: [build, deploy]
    if: needs.build.outputs.previews != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the preview link on each previewed PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SITE: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          PREVIEWS: ${{ needs.build.outputs.previews }}
        run: |
          marker="<!-- dizey-preview -->"
          for number in $PREVIEWS; do
            url="${SITE,,}pr-preview/pr-$number/"
            body="$marker
          Preview: $url

          Opens on the phone too. Rebuilt on every push; removed when the PR closes."
            id=$(gh api "repos/$REPO/issues/$number/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
            else
              gh api "repos/$REPO/issues/$number/comments" -f body="$body" > /dev/null
            fi
          done
